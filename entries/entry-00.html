          <h2 class="sample-title display">where its from, discription of font</h2>
          <p class="body-copy">I went to Zingerman's and took a photo of the most playful package design I saw. I loved how illustrative and fun it was, so I wanted to talk about it this week. The typeface for "Sardines with Hot Pepper" is a chunky, tight-fitting, all-caps display sans with the warmth of a hand-painted sign. A tiny, tilted "with" sits right above a red pepper, which adds to the playfulness. Its font is similar to the main lettering, just a lot less bold. The Fishwife wordmark is a looping brush script with swash tails. The spacing is tight and deliberately uneven, and the hierarchy runs from banner to script logo to small sans-serif facts.
After doing some research on the package and its designer, I learned that co-founder Becca Millstein designed the striking visual identity to disrupt a traditionally dull canned fish market. I also read that the primary font is Recoleta.
Between the folk-art florals, the tarot-style portrait, and the punch of marigold against sky blue, almost every inch is decorated, but the layout never falls apart. The condensed ribbon copy gets pretty tiny, but it's a fair trade for the look. I think I'm drawn to this style because I really love a handmade feel in packaging, and I like when things are playful without being overwhelming.</p>
